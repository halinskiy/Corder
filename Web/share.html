<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared meeting · Corder</title>
    <meta name="description" content="A meeting shared with Corder — transcript, summary and audio." />
    <!-- A share link is unguessable but public; keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Shared meeting · Corder" />
    <meta property="og:description" content="Transcript, summary and audio, shared with Corder." />
    <meta property="og:type" content="website" />
    <!-- The landing's icon set, same files, same order (its layout.tsx declares
         icon.svg → favicon-32 → favicon-16, apple-icon, favicon.ico). A share
         link is a page of the product; it shows the product's mark. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <!-- IBM Plex Sans + Serif: the landing's typefaces (it loads them via
         next/font). The share page is the same brand, so it must not fall back
         to system-ui while the landing runs Plex. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/share/main.tsx"></script>
  </body>
</html>
