<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Warm white background with subtle radial depth so the icon doesn't
         read as a flat sticker against macOS Tahoe's Liquid-Glass tile.
         Tahoe applies its own squircle mask to app icons, so we paint
         full-bleed and let the system round the corners. -->
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f5f4f1"/>
      <stop offset="1" stop-color="#e6e4df"/>
    </radialGradient>

    <!-- Bar fill: deep neutral with a top→bottom value gradient that
         reads as a 3D bevel under the highlight + shadow layers. -->
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2a2a2c"/>
      <stop offset="0.45" stop-color="#0e0e10"/>
      <stop offset="1"    stop-color="#000000"/>
    </linearGradient>

    <!-- Top edge highlight: a thin bright strip lying on the bevel. -->
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="0.7" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Side rim: faint left-edge sheen so the bar feels cylindrical. -->
    <linearGradient id="leftRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="0.18" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Soft cast shadow under the bar onto the white plane. -->
    <filter id="cast" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- 1. Background plate. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 2. Cast shadow for each bar (drawn first so the bar sits on top). -->
  <g opacity="0.35" filter="url(#cast)">
    <rect x="318" y="232" width="160" height="600" rx="44" fill="#000"/>
    <rect x="546" y="232" width="160" height="600" rx="44" fill="#000"/>
  </g>

  <!-- 3. Left bar. -->
  <g>
    <rect x="312" y="212" width="160" height="600" rx="44" fill="url(#bar)"/>
    <!-- Top gloss clipped to top quarter -->
    <rect x="318" y="218" width="148" height="160" rx="36" fill="url(#topGloss)"/>
    <!-- Left rim -->
    <rect x="312" y="212" width="40" height="600" rx="20" fill="url(#leftRim)"/>
  </g>

  <!-- 4. Right bar. -->
  <g>
    <rect x="552" y="212" width="160" height="600" rx="44" fill="url(#bar)"/>
    <rect x="558" y="218" width="148" height="160" rx="36" fill="url(#topGloss)"/>
    <rect x="552" y="212" width="40" height="600" rx="20" fill="url(#leftRim)"/>
  </g>
</svg>
