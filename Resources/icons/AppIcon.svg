<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Apple Icon Template geometry (macOS 11+): the squircle is 824 px
       on a 1024 canvas with a 100-px outer margin reserved for the
       drop-shadow. That margin is what makes a plain white icon read
       as a solid 3D object on dark Dock backgrounds, without it the
       icon looks like a flat rectangle stuck to the wallpaper.
       Corner radius = 824 × 0.2237 ≈ 184 (Apple continuous-curve
       squircle ratio). NO gradients, those wreck small-size renders. -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="#ffffff"/>
  </g>
  <!-- Bars: scaled from the original (340,248 ; 144×528 ; rx 72) by
       824/1024 = 0.8047 and centred by +100 px on both axes. -->
  <rect x="374" y="299" width="116" height="425" rx="58" ry="58" fill="#212121"/>
  <rect x="535" y="299" width="116" height="425" rx="58" ry="58" fill="#212121"/>
</svg>
